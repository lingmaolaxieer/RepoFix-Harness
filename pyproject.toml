[project]
name = "repofix-harness"
version = "0.3.0"
description = "A local Web and CLI coding-agent harness for verifiable Python repairs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
]

[project.scripts]
repofix = "repofix.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repofix = ["builtin_skills/*/SKILL.md", "web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: requires a running Docker daemon and a local test image"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".venv", ".repofix", "test-run-*", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
