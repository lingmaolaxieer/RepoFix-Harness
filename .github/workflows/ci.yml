name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e . pytest pytest-asyncio ruff build
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Offline tests
        run: pytest -q -m "not docker"
      - name: Deterministic harness evaluation
        run: python examples/offline_evaluation.py --output /tmp/repofix-offline-evaluation.json
      - name: Build distributions
        run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e . pytest pytest-asyncio
      - name: Build restricted runner image
        run: docker build -f docker/runner.Dockerfile -t repofix-runner:py312 .
      - name: Docker integration test
        run: pytest -q -m docker
